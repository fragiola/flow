<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Flow fixture</title>
        <style>
            /* the fixture's own few lines: a root of a known size, visible nodes, handles, edges */
            body { margin: 0; font: 13px/1.2 system-ui, sans-serif; }
            [data-flow-part="root"] { width: 800px; height: 500px; background: #f4f4f4; color: #ccc; }
            [data-flow-part="node"] { box-sizing: border-box; min-width: 100px; padding: 10px; background: #fff; color: #111; border: 1px solid #333; user-select: none; }
            [data-flow-part="node"][data-selected] { outline: 2px solid #06f; }
            [data-flow-part="node"][data-flow-id="g"] { background: transparent; border-style: dashed; }
            [data-flow-drag-handle] { display: block; margin-top: 6px; background: #ddd; cursor: grab; }
            [data-flow-part="handle"] { width: 12px; height: 12px; border-radius: 50%; background: #333; }
            [data-flow-part="handle"][data-valid] { background: #0a0; }
            [data-flow-part="handle"][data-invalid] { background: #d00; }
            [data-flow-part="edge-path"], [data-flow-part="connection-path"] { stroke: #333; stroke-width: 2; }
            [data-flow-part="edge-path"][data-selected] { stroke: #06f; }
            [data-flow-part="selection-box"] { background: rgb(0 100 255 / 0.1); border: 1px solid #06f; }
            [data-flow-part="resize-handle"] { background: #06f; }
            [data-flow-part="resize-handle"][data-position*="-"] { width: 10px; height: 10px; }
            [data-flow-part="resize-handle"]:is([data-position="top"], [data-position="bottom"]) { height: 6px; }
            [data-flow-part="resize-handle"]:is([data-position="left"], [data-position="right"]) { width: 6px; }
            [data-flow-part="controls"] { position: absolute; left: 0; top: 0; display: flex; gap: 4px; }
            [data-flow-part="minimap"] { position: absolute; right: 0; bottom: 0; background: #fff; border: 1px solid #333; }
            [data-flow-part="minimap-node"] { fill: #999; }
            [data-flow-part="minimap-mask"] { fill: rgb(0 0 0 / 0.15); }
            [data-flow-part="toolbar"] { background: #fff; color: #111; border: 1px solid #333; padding: 2px 4px; }
            [data-testid="field"] { position: fixed; left: 820px; top: 470px; }
            [data-testid="events"] { position: absolute; left: 820px; top: 0; margin: 0; width: 360px; overflow: hidden; color: #111; font-size: 10px; }
            pre { position: fixed; left: 0; top: 520px; margin: 0; color: #111; font-size: 10px; white-space: pre-wrap; }
            pre[data-testid="json"] { top: 540px; }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module">
            import { mountFlowFixture } from "../../src/fixture/flow-fixture.tsx";
            mountFlowFixture();
        </script>
    </body>
</html>
